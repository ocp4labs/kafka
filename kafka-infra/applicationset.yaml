apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kafka-infra
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: kafka-infra-dev
            path: overlays/dev
          - env: prod
            namespace: kafka-infra
            path: overlays/prod
  template:
    metadata:
      name: 'kafka-infra-{{env}}'
      labels:
        app.kubernetes.io/part-of: kafka-infra
        environment: '{{env}}'
    spec:
      project: default
      source:
        # Update this to your Git repository URL
        repoURL: https://github.com/ocp4labs/kafka.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true

