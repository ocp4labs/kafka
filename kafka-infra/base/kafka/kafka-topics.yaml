apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: products
  namespace: kafka-infra
  labels:
    strimzi.io/cluster: kafka-cluster
    app.kubernetes.io/part-of: kafka-infra
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: clients
  namespace: kafka-infra
  labels:
    strimzi.io/cluster: kafka-cluster
    app.kubernetes.io/part-of: kafka-infra
spec:
  partitions: 1
  replicas: 3
  config:
    cleanup.policy: compact
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: positions
  namespace: kafka-infra
  labels:
    strimzi.io/cluster: kafka-cluster
    app.kubernetes.io/part-of: kafka-infra
spec:
  partitions: 5
  replicas: 3
  config:
    cleanup.policy: compact

