apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka-infra

resources:
  - ../../base

patches:
  # Use persistent storage in production
  - patch: |-
      - op: replace
        path: /spec/kafka/storage
        value:
          type: persistent-claim
          size: 50Gi
          deleteClaim: false
      - op: add
        path: /spec/zookeeper/storage
        value:
          type: persistent-claim
          size: 10Gi
          deleteClaim: false
    target:
      kind: Kafka
      name: kafka-cluster

  # Increase resources for production
  - patch: |-
      - op: add
        path: /spec/kafka/resources/requests/memory
        value: 2Gi
      - op: add
        path: /spec/kafka/resources/limits/memory
        value: 4Gi
      - op: add
        path: /spec/kafka/resources/requests/cpu
        value: 1000m
      - op: add
        path: /spec/kafka/resources/limits/cpu
        value: 2000m
    target:
      kind: Kafka
      name: kafka-cluster

commonLabels:
  environment: prod
  strimzi.io/cluster: kafka-cluster

